<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanning</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="template/css/layout.css">
  <link rel="stylesheet" href="scanning.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
</head>

<body>
    <div class="mobile-container">
    <header class="topbar">
      <div class="nav-back">
        <button class="nav-btn back-btn" onclick="history.back()">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
      </div>
      <div class="nav-center">
        <img src="template/assets/regen-logo.png" alt="REGEN Logo" class="regen-logo">
      </div>
      <div class="nav-right">
        <button class="nav-btn profile-btn" onclick="setActive(this, 'profile.html')">
          <img id="navAvatar" src="template/assets/profile.png" alt="Profile" class="profile-icon">
        </button>
      </div>
    </header>

    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="template/assets/regen-logo.png" alt="REGEN Logo" class="sidebar-logo">
        <button id="closeSidebar" class="close-btn">&times;</button>
      </div>

      <nav class="sidebar-menu">
        <h3 class="menu-category">Help Center</h3>
        <ul class="menu-section">
          <li><a href="settings/settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
          <li><a href="faqs/faqs.html"><i class="fa-solid fa-circle-question"></i> FAQs</a></li>
          <li><a href="contact/contact.html"><i class="fa-solid fa-envelope"></i> Contact Us</a></li> 
        </ul>

        <h3 class="menu-category">Community</h3>
        <ul class="menu-section">
          <li><a href="feedback/feedback.html"><i class="fa-solid fa-comment-dots"></i> Feedback</a></li>
          <li><a href="about/about.html"><i class="fa-solid fa-leaf"></i> About REGEN</a></li>
        </ul>

        <h3 class="menu-category">Legal</h3>
        <ul class="menu-section">
          <li><a href="termsncon/termsncon.html"><i class="fa-solid fa-file-contract"></i> Terms & Conditions</a></li>
        </ul>

      </nav>
    </div>
 
    <div class="scan-content">
      <div class="scan-preview-section">
        <div class="scan-preview-frame">
          <div class="scan-corner scan-corner-tl"></div>
          <div class="scan-corner scan-corner-tr"></div>
          <div class="scan-corner scan-corner-bl"></div>
          <div class="scan-corner scan-corner-br"></div>
          <div class="scan-preview-inner">
            <video id="cameraVideo" autoplay playsinline muted class="scan-camera-window"></video>
            <div id="cameraError" class="camera-error hidden">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#52ab78" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              <p class="camera-error-title" id="errorMessage">Camera access denied</p>
              <p class="camera-error-subtitle">Please allow camera permissions</p>
            </div>
          </div>
        </div>
      </div>
 
      <div class="tabs-wrapper">
        <div class="scan-tabs-section">
          <button class="scan-tab scan-tab-active" onclick="setActiveTab(event)">Scan</button>
          <button class="scan-tab" onclick="setActiveTab(event)">Label</button>
          <button class="scan-tab" onclick="setActiveTab(event)">Barcode</button>
        </div>
      </div>
 
      <div class="scan-actions-section">
 
        <!-- GALLERY UPLOAD BUTTON -->
        <button class="scan-action scan-action-gallery" onclick="document.getElementById('galleryInput').click()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="uploadFromGallery(event)">
 
        <!-- SHUTTER BUTTON -->
        <button class="scan-action scan-action-shutter" onclick="captureImage()">
          <span></span>
        </button>
 
        <!-- HISTORY STACK -->
        <div class="history-stack">
          <img src="https://images.unsplash.com/photo-1523365280197-f1783db9c6c3?q=80&w=400&auto=format&fit=crop" alt="history">
          <img src="https://images.unsplash.com/photo-1523365280197-f1783db9c6c3?q=80&w=400&auto=format&fit=crop" alt="history">
          <img src="https://images.unsplash.com/photo-1523365280197-f1783db9c6c3?q=80&w=400&auto=format&fit=crop" alt="history">
        </div>
 
      </div>
    </div>
  </div>
 
  <canvas id="canvas" style="display:none;"></canvas>
    <script src="scanning.js"></script>
    <script src="auth.js"></script>
    <script src="template/js/nav.js"></script>

    <script>
      (async () => {
        const session = await requireAuth();
        if (!session) {
          // requireAuth already shows alert and redirects
          // but as a fallback:
          alert('Your session has expired. Please sign in again.');
          window.location.href = 'signin.html';
        }
      })();
    </script>
    
</body>
</html>
