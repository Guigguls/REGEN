<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals - REGEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container goals-bg">
        <div class="goals-content">
            <header class="mb-8">
                <h1 class="goals-title">Which of these goal would you like to achieve?</h1>
                <p class="goals-subtitle">Pick as many you'd like</p>
            </header>

            <!-- Goals Bubble Grid -->
            <div class="goals-grid">
                <div class="goal-item" onclick="toggleGoal(this)">
                    <div class="goal-circle dark-green">
                        <span class="emoji"> <img src="segregatewaste.png" alt="Segregate Waste" /></span>
                        <p>Segregate Waste</p>
                    </div>
                </div>

                <div class="goal-item" onclick="toggleGoal(this)">
                    <div class="goal-circle light-green">
                        <span class="emoji"><img src="increaseawareness.png" alt="Increase Awareness" /></span>
                        <p>Increase Awareness</p>
                    </div>
                </div>

                <div class="goal-item" onclick="toggleGoal(this)">
                    <div class="goal-circle light-green">
                        <span class="emoji"><img src="trackimpact.png" alt="Track your Impact" /></span>
                        <p>Track your Impact</p>
                    </div>
                </div>

                <div class="goal-item" onclick="toggleGoal(this)">
                    <div class="goal-circle dark-green">
                        <span class="emoji"><img src="supportrecycling.png" alt="Support Recycling" /></span>
                        <p>Support Recycling</p>
                    </div>
                </div>

                <div class="goal-item" onclick="toggleGoal(this)">
                    <div class="goal-circle dark-green">
                        <span class="emoji"><img src="spacesclean.png" alt="Keep Spaces Clean" /></span>
                        <p>Keep Spaces Clean</p>
                    </div>
                </div>

                <div class="goal-item" onclick="toggleGoal(this)">
                    <div class="goal-circle light-green">
                        <span class="emoji"> <img src="improperdisposal.png" alt="Reduce Improper Disposal" /></span>
                        <p style = width:100px;>Reduce Improper Disposal</p>
                    </div>
                </div>
            </div>

            <button class="login-btn" onclick="window.location.replace('template/home.html')">Continue</button>
        </div>
    </div>

    <script>
        function toggleGoal(element) {
            element.classList.toggle('selected');
        }
    </script>
</body>
</html>
