<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGEN - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="dashStyle.css">
  <link rel="stylesheet" href="template/css/layout.css">
</head>
<body>
 
  <div class="mobile-container">
    <header class="topbar">
      <div class="nav-left">
        <button class="nav-btn menu-btn">
          <img src="template/assets/menu.png" alt="Menu" class="menu-icon">
        </button>
      </div>
      <div class="nav-center">
        <img src="template/assets/regen-logo.png" alt="REGEN Logo" class="regen-logo">
      </div>
      <div class="nav-right">
        <button class="nav-btn profile-btn" onclick="setActive(this, 'profile.html')">
          <img id="navAvatar" src="template/assets/profile.png" alt="Profile" class="profile-icon">
        </button>
      </div>
    </header>
 
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="template/assets/regen-logo.png" alt="REGEN Logo" class="sidebar-logo">
        <button id="closeSidebar" class="close-btn">&times;</button>
      </div>

      <nav class="sidebar-menu">
        <h3 class="menu-category">Help Center</h3>
        <ul class="menu-section">
          <li><a href="settings/settings.html  "><i class="fa-solid fa-gear"></i> Settings</a></li>
          <li><a href="faqs/faqs.html"><i class="fa-solid fa-circle-question"></i> FAQs</a></li>
          <li><a href="contact/contact.html"><i class="fa-solid fa-envelope"></i> Contact Us</a></li> 
        </ul>

        <h3 class="menu-category">Community</h3>
        <ul class="menu-section">
          <li><a href="feedback/feedback.html"><i class="fa-solid fa-comment-dots"></i> Feedback</a></li>
          <li><a href="about/about.html"><i class="fa-solid fa-leaf"></i> About REGEN</a></li>
        </ul>

        <h3 class="menu-category">Legal</h3>
        <ul class="menu-section">
          <li><a href="termsncon/termsncon.html"><i class="fa-solid fa-file-contract"></i> Terms & Conditions</a></li>
        </ul>

      </nav>
    </div>

    <!-- Overlay (outside sidebar) -->
    <div id="overlay" class="overlay"></div>

    <main class="main-content">
      <div class="map-page-wrapper">
      <!-- Map stays fixed at the top -->
      <div id="map-display"></div>

      <!-- Draggable Bottom Sheet -->
      <div class="bottom-sheet" id="interactive-sheet">
          <div class="drag-handle-container">
              <div class="drag-handle"></div>
          </div>

          <section class="nearby-centers">
              <h2 class="nearby-title">Nearby Recycling Centers</h2>
              <p class="nearby-subtitle">Find the closest location to drop off recyclables</p>

              <div class="center-list">
                  <div class="center-item-card">
                      <div class="center-icon-circle"><div class="inner-dot"></div></div>
                      <div class="center-details">
                          <h3>Location</h3>
                          <p>facility</p>
                      </div>
                      <div class="center-distance">--km</div>
                  </div>
              </div>
          </section>
        </div>
      </div>
    </main>
 
    <footer class="footer">
      <nav class="bottom-nav">
        <button class="nav-btn" onclick="setActive(this, 'template/home.html')">
          <img src="template/assets/home.png" alt="Home">
        </button>
 
        <button class="nav-btn" onclick="setActive(this, 'dashboard.html')">
          <img src="template/assets/grid.png" alt="Grid">
        </button>
 
        <div class="scan-wrapper">
          <button class="scan-btn" onclick="setActive(this, 'scanning.html')">
            <img src="template/assets/scan.png" alt="Scan">
          </button>
          <span class="scan-label">SCAN</span>
        </div>
 
        <button class="nav-btn" onclick="setActive(this, 'challenges.html')">
          <img src="template/assets/target.png" alt="Target">
        </button>
 
        <button class="nav-btn" onclick="setActive(this, 'locator.html')">
          <img src="template/assets/location.png" alt="Location">
        </button>
      </nav>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="map.js"></script>
  <script src="template/js/nav.js"></script>
</body>
</html>
